name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to test DB
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Dep-cruise (risk engine isolation)
        run: pnpm depcruise

      - name: Knip (unused exports / dead deps)
        run: pnpm knip

      - name: Unit + integration tests (Vitest) + coverage
        run: pnpm test:coverage

      # Cache the Playwright browser binaries. cdn.playwright.dev is flaky
      # in the Azure runner network (issue surfaced 2026-06-02 — Chromium
      # download stalled silently after Chrome-for-Testing finished and the
      # subsequent FFmpeg / chromium-headless-shell downloads never started).
      # Cache key is the Playwright version pinned in pnpm-lock.yaml: cache
      # invalidates only when Playwright bumps. First run after a version
      # bump pays the full download; every subsequent run is a sub-second
      # cache hit.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright pinned at $VERSION"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system deps (always — small apt-get layer)
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright browsers (cache miss only, with retry)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            echo "::group::Playwright browsers download — attempt $attempt"
            if timeout 240 pnpm exec playwright install chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Playwright install attempt $attempt failed/stalled — retrying after backoff"
            sleep $((attempt * 15))
          done
          echo "::error::Playwright browsers download failed after 3 attempts (likely cdn.playwright.dev throttling)"
          exit 1

      - name: E2E smoke tests (Playwright)
        run: pnpm exec playwright test

      - name: Build app for Lighthouse CI
        run: pnpm build

      - name: Lighthouse CI (perf >=0.90, LCP <2.5s, transfer <=200KB)
        run: pnpm exec lhci autorun --config=.lighthouserc.json

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lychee
        run: |
          curl -sSL -o /tmp/lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.23.0/lychee-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/lychee.tar.gz -C /usr/local/bin/ lychee
          lychee --version

      - name: Link check (README.md — DASH-09 anchor)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lychee --no-progress --include-fragments ./README.md
