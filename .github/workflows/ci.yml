name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/test

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Path-filter: backend-only PRs (adapters, schemas, scripts, unit
      # tests, workflows, docs) skip the heavy Playwright + Lighthouse
      # pipeline entirely. Vercel's preview deploy validates the build for
      # those PRs and the unit/contract tests cover the logic surface.
      #
      # Triggered only when something the E2E / Lighthouse suite can
      # observably regress changes: pages, components, global styles,
      # middleware, public assets, framework config, playwright config,
      # the e2e tests themselves, or the Lighthouse budget. Also includes
      # lockfile / package.json so a dep bump that affects bundle output
      # still gets the full Lighthouse pass.
      - name: Detect UI changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              # Pages, layouts, components, middleware — anything an E2E
              # or Lighthouse run can observably touch.
              - 'src/app/**'
              # API routes are exercised by Vitest integration tests, not
              # by Playwright — exclude so backend-only PRs don't pay the
              # E2E + Lighthouse tax.
              - '!src/app/api/**'
              # *.test.* alongside source files are unit tests, not E2E.
              - '!src/app/**/*.test.*'
              - '!src/app/**/*.snap'
              - 'src/components/**'
              - '!src/components/**/*.test.*'
              - 'src/middleware.ts'
              - 'public/**'
              - 'next.config.ts'
              - 'tailwind.config.*'
              - 'postcss.config.*'
              - 'playwright.config.ts'
              - 'tests/e2e/**'
              - '.lighthouserc.json'

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to test DB
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Dep-cruise (risk engine isolation)
        run: pnpm depcruise

      - name: Knip (unused exports / dead deps)
        run: pnpm knip

      - name: Unit + integration tests (Vitest) + coverage
        run: pnpm test:coverage

      # Cache the Playwright browser binaries. cdn.playwright.dev had a
      # post-download stall on 2026-06-02 (Chromium 170MB downloaded in
      # ~1.5s, then ~4min of silence before extraction completed) — see
      # PR #16 thread. Caching keyed by Playwright version means the
      # download path only runs on version bumps. Skipped entirely on
      # backend-only PRs (see `Detect UI changes` above).
      - name: Resolve Playwright version
        if: steps.changes.outputs.ui == 'true'
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright pinned at $VERSION"

      - name: Cache Playwright browsers
        if: steps.changes.outputs.ui == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system deps (always when E2E runs — small apt-get layer)
        if: steps.changes.outputs.ui == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright browsers (cache miss only, with retry)
        if: steps.changes.outputs.ui == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            echo "::group::Playwright browsers download — attempt $attempt"
            if timeout 240 pnpm exec playwright install chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Playwright install attempt $attempt failed/stalled — retrying after backoff"
            sleep $((attempt * 15))
          done
          echo "::error::Playwright browsers download failed after 3 attempts (Playwright CDN post-download stall — see PR #16 thread)"
          exit 1

      - name: E2E smoke tests (Playwright)
        if: steps.changes.outputs.ui == 'true'
        run: pnpm exec playwright test

      - name: Build app for Lighthouse CI
        if: steps.changes.outputs.ui == 'true'
        run: pnpm build

      - name: Lighthouse CI (perf >=0.90, LCP <2.5s, transfer <=200KB)
        if: steps.changes.outputs.ui == 'true'
        run: pnpm exec lhci autorun --config=.lighthouserc.json

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lychee
        run: |
          curl -sSL -o /tmp/lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.23.0/lychee-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/lychee.tar.gz -C /usr/local/bin/ lychee
          lychee --version

      - name: Link check (README.md — DASH-09 anchor)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lychee --no-progress --include-fragments ./README.md
